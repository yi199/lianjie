<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>练界 · 可交互演示</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #EDEBDF;
  font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  color: #1F231C; -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 24px;
}
.stage { display: flex; align-items: center; gap: 64px; flex-wrap: wrap; justify-content: center; }

/* ---------- 手机 ---------- */
.phone {
  width: 375px; height: 812px; border-radius: 46px; background: #F2F0E6;
  border: 7px solid #17190F; position: relative; overflow: hidden;
  box-shadow: 0 30px 70px rgba(23,25,15,.20); flex-shrink: 0;
}
.statusbar {
  height: 44px; display: flex; align-items: center; padding-left: 22px;
  font-family: -apple-system, "PingFang SC", sans-serif; font-size: 12px;
  font-weight: 600; position: relative; z-index: 20;
}
.statusbar.dark { color: #F2F0E6; }
.capsule {
  position: absolute; right: 12px; top: 8px; height: 30px; width: 88px;
  border-radius: 15px; border: .5px solid rgba(0,0,0,.12);
  background: rgba(255,255,255,.55); display: flex; align-items: center;
  justify-content: space-evenly; font-size: 11px; color: #333; z-index: 21;
}
.capsule .d { width: 4px; height: 4px; border-radius: 50%; background: #333; }
.capsule.dark { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.18); }
.capsule.dark, .capsule.dark .d { color: #F2F0E6; background-color: transparent; }
.capsule.dark .d { background: #F2F0E6; }

.view { position: absolute; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 44px 0 0 0; overflow: hidden; }
.screen.enter { animation: pageIn .26s cubic-bezier(.23,.9,.3,1) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- tabBar ---------- */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 54px;
  background: #FAF9F3; border-top: .5px solid #EBE8DC; display: flex;
  align-items: center; z-index: 15;
}
.tb { flex: 1; text-align: center; cursor: pointer; padding-top: 5px; }
.tb img { width: 21px; height: 21px; display: block; margin: 0 auto 1px; }
.tb span { font-size: 9.5px; color: #A9A79A; }
.tb.on span { color: #3C4A32; }

/* ---------- 通用 ---------- */
.pg { padding: 4px 20px 0; height: 100%; overflow-y: auto; }
.pg::-webkit-scrollbar { display: none; }
.brandrow { display: flex; align-items: baseline; justify-content: space-between; padding-top: 4px; }
.brand { font-size: 12px; letter-spacing: .3em; }
.date { font-size: 9.5px; letter-spacing: .06em; color: #A9A79A; }
.h1en { margin-top: 16px; font-family: Georgia, serif; font-size: 9.5px;
        letter-spacing: .28em; text-transform: uppercase; color: #A9A79A; }
.h1 { margin-top: 5px; font-size: 30px; line-height: 1.24; }
.sech { margin-top: 20px; font-size: 9.5px; letter-spacing: .2em;
        text-transform: uppercase; color: #A9A79A; }

/* ---------- 欢迎 ---------- */
.welcome { height: 100%; padding: 0 28px 26px; display: flex; flex-direction: column; }
.welcome .mark { margin-top: 60px; font-size: 52px; letter-spacing: .1em; line-height: 1.15; }
.welcome .rule { width: 32px; height: 1.5px; background: #3C4A32; margin: 20px 0 24px; }
.welcome .sl { font-size: 21px; line-height: 1.75; color: #3C4A32; }
.welcome .en { margin-top: 30px; font-family: Georgia, serif; font-size: 9.5px;
               letter-spacing: .28em; color: #A9A79A; }
.welcome .foot { margin-top: auto; }
.wbtn {
  height: 52px; border-radius: 26px; background: #fff; border: .5px solid #EBE8DC;
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  font-size: 15px; cursor: pointer;
}
.wbtn .arw { font-family: Georgia, serif; color: #8B897C; }
.wbtn.off { background: #F7F6EE; color: #B8B5A6; border-color: #EFEDE2; cursor: default; }
.welcome .hint { margin-top: 11px; text-align: center; font-size: 11px; color: #A9A79A; }

/* ---------- 引导 ---------- */
.onb { height: 100%; padding: 26px 28px 26px; display: flex; flex-direction: column; }
.qno { font-size: 9.5px; letter-spacing: .26em; color: #B4795A; }
.qt { margin-top: 10px; font-size: 23px; }
.qs { margin-top: 7px; font-size: 11.5px; color: #8B8978; }
.opts { margin-top: 26px; }
.opt { padding: 16px; border: .5px solid #EBE8DC; border-radius: 13px;
       background: #fff; margin-bottom: 11px; cursor: pointer; transition: .15s; }
.opt:hover { border-color: #C9C6B8; }
.opt.on { background: #ECEEE3; border-color: #3C4A32; }
.opt .ot { font-size: 15px; }
.opt .od { margin-top: 4px; font-size: 11.5px; color: #8B8978; }
.chips2 { margin-top: 14px; display: flex; }
.chip2 { flex: 1; height: 44px; margin-right: 10px; border-radius: 22px;
         border: .5px solid #EBE8DC; background: #fff; display: flex;
         align-items: center; justify-content: center; font-size: 12.5px;
         color: #4A4A3E; cursor: pointer; transition: .15s; }
.chip2:last-child { margin-right: 0; }
.chip2.on { background: #3C4A32; border-color: #3C4A32; color: #F6F4EA; }
.pv { margin-top: 26px; padding: 16px; background: #ECEEE3; border-radius: 13px; }
.pv .l { font-size: 9.5px; letter-spacing: .2em; color: #7C8A70; }
.pv .t { margin-top: 7px; font-size: 14px; color: #3C4A32; line-height: 1.5; }
.onb .foot { margin-top: auto; }

/* ---------- 首页 ---------- */
.dots-week { margin-top: 18px; display: flex; align-items: center; }
.dw { width: 9px; height: 9px; border-radius: 50%; background: #DEDBCB; margin-right: 8px; }
.dw.on { background: #3C4A32; }
.dwt { margin-left: 4px; font-size: 12px; color: #8B897C; }
.card { position: relative; margin-top: 18px; padding: 20px 18px 18px;
        border-radius: 20px; background: #fff; overflow: hidden; }
.art { position: absolute; left: 50%; top: 16px; width: 150px; margin-left: -75px; }
.cbody { position: relative; padding-top: 158px; }
.cen { font-family: Georgia, serif; font-size: 9.5px; letter-spacing: .26em; color: #A9A79A; }
.cname { margin-top: 5px; font-size: 28px; line-height: 1.15; }
.cmeta { margin-top: 10px; font-size: 11.5px; color: #8B897C; }
.cdim { margin-top: 3px; font-size: 11.5px; color: #A9A79A; }
.cbtn { margin-top: 16px; height: 48px; border-radius: 24px; background: #F7F6EE;
        border: .5px solid #EBE8DC; display: flex; align-items: center;
        justify-content: space-between; padding: 0 18px; font-size: 14.5px; cursor: pointer; }
.cbtn:hover { background: #F0F2E4; }
.cbtn .arw { font-family: Georgia, serif; color: #8B897C; }
.items { margin-top: 8px; border-top: .5px solid #EBE8DC; }
.it { display: flex; align-items: center; padding: 9px 0; border-bottom: .5px solid #EBE8DC; cursor: pointer; }
.it:hover { background: #fff; }
.it .no { width: 24px; font-family: Georgia, serif; font-size: 9.5px; color: #A9A79A; }
.it .nm { flex: 1; }
.it .cn { font-size: 15px; }
.it .en { display: block; margin-top: 2px; font-family: Georgia, serif;
          font-size: 9.5px; letter-spacing: .08em; color: #A9A79A; }
.it .ss { font-family: Georgia, serif; font-size: 12px; color: #8B897C; }
.it .tk { margin-left: 8px; font-size: 12px; color: #3C4A32; }
.tip { margin-top: 16px; padding: 12px; border-radius: 11px; background: #EFF2E7;
       font-size: 11.5px; line-height: 1.7; color: #6F7D63; }

/* ---------- 记录页 ---------- */
.rnav { display: flex; align-items: center; padding: 4px 20px 0; }
.rnav .back { width: 32px; font-size: 23px; line-height: 1; cursor: pointer; }
.rnav .tt { flex: 1; font-size: 15px; }
.rnav .tt .en { display: block; margin-top: 2px; font-family: Georgia, serif;
                font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: #A9A79A; }
.rnav .swap { font-size: 9.5px; color: #8B897C; border: .5px solid #EBE8DC;
              border-radius: 15px; padding: 4px 11px; cursor: pointer; }
.rwrap { padding: 0 20px 84px; height: 100%; overflow-y: auto; }
.rwrap::-webkit-scrollbar { display: none; }
.exh { padding-top: 16px; }
.exh .nm { font-size: 23px; line-height: 1.2; }
.exh .en { margin-top: 4px; font-family: Georgia, serif; font-size: 9.5px;
           letter-spacing: .2em; text-transform: uppercase; color: #A9A79A; }
.barbell { display: flex; align-items: center; justify-content: center; margin: 18px 0 4px; }
.side { display: flex; align-items: center; }
.side.left { flex-direction: row-reverse; }
.plate { width: 10px; height: 48px; margin: 0 2px; border-radius: 3px;
         background: #DCD8C8; transition: background .4s, transform .3s; }
.plate.on { background: #3C4A32; transform: translateY(-2px); }
.plate.pr { background: #B4795A; }
.bar { flex: 1; height: 4px; border-radius: 2px; background: #3C4A32; }
.bignum { margin-top: 10px; text-align: center; line-height: 1; }
.bignum .n { font-family: Georgia, serif; font-size: 54px; letter-spacing: -.02em; }
.bignum .u { font-size: 12px; color: #A9A79A; margin-left: 6px; }
.sdots { margin-top: 10px; display: flex; justify-content: center; }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: #DCD8C8; margin: 0 3.5px; }
.sdot.on { background: #3C4A32; }
.sdot.pr { background: #B4795A; }
.hint { margin-top: 11px; text-align: center; font-size: 10.5px; color: #A9A79A; }
.sug { margin-top: 4px; text-align: center; font-size: 10.5px; color: #B4795A; }
.facts { margin-top: 14px; border-top: .5px solid #EBE8DC; }
.facts .f { display: flex; justify-content: space-between; align-items: baseline;
            padding: 8px 0; border-bottom: .5px solid #EBE8DC; }
.facts .k { font-size: 11px; color: #8B897C; }
.facts .v { font-size: 11px; text-align: right; }
.sets { margin-top: 12px; }
.sh { display: flex; justify-content: space-between; font-size: 11px;
      color: #A9A79A; padding-bottom: 3px; }
.sh .n2 { font-size: 9.5px; }
.srow { display: flex; align-items: center; padding: 10px 0;
        border-bottom: .5px solid #EBE8DC; cursor: pointer; }
.srow:hover { background: #fff; }
.srow .i { width: 18px; font-family: Georgia, serif; font-size: 12px; color: #A9A79A; }
.srow .w { font-family: Georgia, serif; font-size: 17px; width: 50px; }
.srow .x { font-size: 11px; color: #A9A79A; }
.srow .r { font-family: Georgia, serif; font-size: 17px; width: 40px; }
.srow .u { font-size: 10.5px; color: #A9A79A; margin-left: 2px; }
.srow .tag { font-size: 8px; background: #F2E6C9; color: #7A6021;
             border-radius: 6px; padding: 2px 5px; margin-left: 6px; }
.srow .ck { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #CFCCBC;
            margin-left: auto; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: transparent; transition: .2s; }
.srow.done .ck { background: #3C4A32; border-color: #3C4A32; color: #fff; }
.srow.done .w, .srow.done .r { color: #A9A79A; }
.addset { padding: 12px 0 4px; font-size: 11.5px; color: #8B897C; }
.footbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 22px;
           background: linear-gradient(to top, #F2F0E6 76%, rgba(242,240,230,0)); z-index: 10; }
.fbtn { height: 50px; border-radius: 25px; background: #fff; border: .5px solid #EBE8DC;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; cursor: pointer; }
.fbtn:hover { background: #F7F6EE; }

/* ---------- 呼吸环 ---------- */
.breathwrap { position: absolute; inset: 0; background: rgba(242,240,230,.99);
              display: flex; flex-direction: column; align-items: center;
              justify-content: center; padding-bottom: 40px; z-index: 30; }
.rtitle { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
          color: #A9A79A; margin-bottom: 34px; }
.breath { position: relative; width: 210px; height: 210px;
          display: flex; align-items: center; justify-content: center; }
.ring { position: absolute; inset: 0; border-radius: 50%; }
.ring::after { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: #F2F0E6; }
.glow { position: absolute; width: 150px; height: 150px; border-radius: 50%;
        background: radial-gradient(circle, rgba(60,74,50,.14) 0%, rgba(60,74,50,.04) 55%, rgba(60,74,50,0) 72%);
        animation: breathe 9s ease-in-out infinite; }
.core { position: relative; z-index: 2; width: 110px; height: 110px; border-radius: 50%;
        background: rgba(238,242,228,.94); display: flex; flex-direction: column;
        align-items: center; justify-content: center; animation: breathe 9s ease-in-out infinite; }
.core .tm { font-family: Georgia, serif; font-size: 30px; color: #3C4A32; line-height: 1; }
.core .ph { margin-top: 5px; font-size: 9px; letter-spacing: .2em; color: #8B897C; }
@keyframes breathe { 0% { transform: scale(.82); } 55% { transform: scale(1.06); } 100% { transform: scale(.82); } }
.rsub { margin-top: 36px; font-size: 11px; color: #8B897C; }
.rsk { margin-top: 14px; font-size: 10.5px; color: #A9A79A;
      text-decoration: underline; cursor: pointer; }

/* ---------- 数据页 ---------- */
.nums { margin-top: 22px; display: flex; align-items: flex-end; }
.nums .st { margin-right: 30px; }
.nums .v { font-family: Georgia, serif; font-size: 23px; line-height: 1; }
.nums .k { margin-top: 6px; font-size: 9.5px; letter-spacing: .06em; color: #A9A79A; }
.cal { margin-top: 18px; }
.cal .wd { width: 14.28%; text-align: center; font-size: 9.5px;
           color: #A9A79A; padding-bottom: 8px; display: inline-block; }
.cgrid { display: flex; flex-wrap: wrap; }
.cell { width: 14.28%; height: 37px; display: flex; align-items: center; justify-content: center; }
.cell .cd { width: 27px; height: 27px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-family: Georgia, serif; font-size: 12px; color: #8B897C; }
.cell.on .cd { background: #3C4A32; color: #F6F4EA; }
.cell.today .cd { border: .5px solid #B4795A; color: #B4795A; }
.cell.on.today .cd { border-color: transparent; color: #F6F4EA; }
.prow { display: flex; align-items: center; margin-bottom: 10px; }
.prow .nm { width: 46px; font-size: 12px; color: #8B897C; }
.prow .bw { flex: 1; height: 5px; border-radius: 3px; background: #E6E3D5; overflow: hidden; }
.prow .bf { height: 100%; border-radius: 3px; background: #3C4A32; transition: width .4s; }
.prow .pc { width: 46px; text-align: right; font-size: 12px; color: #A9A79A; }
.empty2 { margin-top: 40px; text-align: center; }
.empty2 .e1 { font-size: 19px; }
.empty2 .e2 { margin-top: 10px; font-size: 11.5px; line-height: 1.8; color: #8B897C; }

/* ---------- 战报 ---------- */
.dark { height: 100%; background: #2A3226; padding: 0 24px; position: relative; }
.dark .kick { padding-top: 14px; font-family: Georgia, serif; font-size: 9.5px;
              letter-spacing: .26em; color: #8C9A80; }
.dark .h1en { color: #8C9A80; margin-top: 13px; }
.dark .h1 { color: #F2F0E6; margin-top: 6px; font-size: 28px; }
.dark .plan { margin-top: 7px; font-size: 12.5px; color: #A8B79C; }
.dnums { margin-top: 28px; display: flex; align-items: flex-end; }
.dnums .st { margin-right: 26px; }
.dnums .v { font-family: Georgia, serif; font-size: 36px; color: #F2F0E6; line-height: 1; }
.dnums .k { margin-top: 6px; font-size: 10.5px; letter-spacing: .1em; color: #8C9A80; }
.prbox { margin-top: 24px; padding: 14px; border-radius: 12px;
         background: rgba(208,139,99,.14); border: .5px solid rgba(208,139,99,.35); }
.prhead { display: flex; align-items: center; }
.prhead .d2 { width: 6px; height: 6px; border-radius: 50%; background: #D08B63; margin-right: 7px; }
.prhead .t { font-size: 12px; color: #E5A882; }
.prrow { margin-top: 10px; display: flex; align-items: baseline; }
.prrow .cn { flex: 1; font-size: 13.5px; color: #F2F0E6; }
.prrow .w { font-family: Georgia, serif; font-size: 14.5px; color: #E5A882; }
.prrow .dl { margin-left: 8px; font-size: 11px; color: #8C9A80; }
.dark .sech { color: #8C9A80; margin-top: 22px; }
.dark .prow .nm { color: #C8D2BE; }
.dark .prow .bw { background: #3C4636; }
.dark .prow .bf { background: #A8BC96; }
.dark .prow .pc { color: #8C9A80; }
.dark .comment { margin-top: 22px; font-size: 13.5px; line-height: 1.85; color: #A8B79C; }
.dbtn { position: absolute; left: 24px; right: 24px; bottom: 26px; height: 50px;
        border-radius: 25px; background: #F2F0E6; color: #2A3226;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; cursor: pointer; }

/* ---------- 我的 ---------- */
.pcard { margin-top: 18px; padding: 18px; border-radius: 20px; background: #fff; }
.pcard .cl { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: #A9A79A; }
.pcard .cn2 { margin-top: 9px; font-size: 18px; }
.pcard .keys { margin-top: 10px; display: flex; }
.pcard .pk { margin-right: 18px; display: flex; align-items: baseline; }
.pcard .pk b { font-family: Georgia, serif; font-weight: 400; font-size: 12px;
               color: #B4795A; margin-right: 4px; }
.pcard .pk span2 { font-size: 12px; color: #8B897C; }
.pcard .pk .s2 { font-size: 12px; color: #8B897C; }
.chips3 { margin-top: 10px; display: flex; }
.chip3 { flex: 1; height: 41px; margin-right: 10px; border-radius: 21px;
         border: .5px solid #EBE8DC; background: #fff; display: flex;
         align-items: center; justify-content: center; font-size: 12px;
         color: #8B897C; cursor: pointer; transition: .15s; }
.chip3:last-child { margin-right: 0; }
.chip3.on { background: #3C4A32; border-color: #3C4A32; color: #F6F4EA; }
.rows { margin-top: 10px; border-top: .5px solid #EBE8DC; }
.row2 { display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 0; border-bottom: .5px solid #EBE8DC; cursor: pointer; }
.row2 .rt { font-size: 15px; }
.row2 .rt.danger { color: #B4795A; }
.row2 .rn { font-size: 12px; color: #A9A79A; }
.about { margin-top: 22px; text-align: center; font-size: 9.5px;
         letter-spacing: .08em; color: #A9A79A; }

/* ---------- 右侧说明 ---------- */
.sidebar { flex: 0 0 300px; max-width: 300px; }
.sidebar .k2 { font-family: Georgia, serif; font-size: 10px; letter-spacing: .3em;
            text-transform: uppercase; color: #A9A79A; }
.sidebar h2 { margin-top: 14px; font-size: 26px; font-weight: 400; }
.sidebar p { margin-top: 12px; font-size: 13px; line-height: 1.9; color: #6E6C60; }
.sidebar .lst { margin-top: 20px; }
.sidebar .lst div { font-size: 12.5px; line-height: 2.1; color: #55534A; }
.sidebar .lst b { font-family: Georgia, serif; font-weight: 400; color: #B4795A; margin-right: 8px; }
.sidebar button {
  margin-top: 26px; height: 40px; padding: 0 20px; border-radius: 20px;
  border: .5px solid #C9C6B8; background: transparent; font-size: 12.5px;
  color: #55534A; cursor: pointer; font-family: inherit;
}
.sidebar button:hover { background: #fff; }
@media (max-width: 860px) {
  .stage { gap: 32px; } .sidebar { flex: 0 0 375px; max-width: 375px; }
}
</style>
</head>
<body>

<div class="stage">

  <div class="phone">
    <div class="statusbar" id="statusbar">9:41
      <div class="capsule" id="capsule"><span class="d"></span><span class="d"></span><span class="d"></span><span style="font-size:13px">⊙</span></div>
    </div>
    <div class="view"><div id="view" class="screen"></div></div>
    <div id="tabbar" class="tabbar" style="display:none"></div>
  </div>

  <div class="sidebar">
    <div class="k2">Interactive demo</div>
    <h2>练界</h2>
    <p>一个只做一件事的健身小程序：今天练什么、练了多重、练了多少。<br>
       数据只存在手机本地，不社交、不卖课。</p>
    <div class="lst">
      <div><b>①</b>点「开始」走一遍首次引导</div>
      <div><b>②</b>点「开始训练」进记录页</div>
      <div><b>③</b>点任意一行组记录 → 杠铃片点亮、呼吸环出现</div>

const S = {
  screen: 'welcome', step: 0,
  level: 'some', days: 3, place: 'gym',
  planIdx: 0, exIdx: 0,
  done: {}, records: [],
  resting: false, restLeft: 0, timer: null,
  enter: false
};

/* ---------------- 计划 ---------------- */
function plans() { return D.plans[S.days + '-' + S.place] || D.plans['3-gym']; }
function plan() { return plans()[S.planIdx % plans().length]; }
function weekTarget() { return S.days; }
function todayDone() {
  // demo 里今天最多算一次（练完就是 1）
  return S.records.length ? 1 : 0;
}

/* ---------------- 小工具 ---------------- */
function setsOf(i) {
  const it = plan().items[i];
  const out = [];
  for (let k = 0; k < it.sets; k++) {
    out.push({
      no: k + 1, weight: it.weight, reps: it.reps, unit: it.unit || 'kg',
      done: !!S.done[i + ':' + (k + 1)]
    });
  }
  return out;
}
function curWeight(i) {
  const s = setsOf(i).filter(x => !x.done)[0] || setsOf(i)[0];
  return s ? s.weight : 0;
}
function curUnit(i) {
  const it = plan().items[i];
  return it.unit === 'sec' ? '秒' : (it.unit === 'bw' ? '次' : 'kg');
}
function isPR(i, no) {
  // demo 里固定第 2 组算 PR（真机逻辑是比较历史最大重量）
  return no === 2 && (plan().items[i].unit || 'kg') === 'kg' && plan().items[i].weight > 0;
}
function vol() {
  return S.records.reduce((a, r) => a + r.weight * r.reps, 0);
}
function partPct() {
  const m = {};
  S.records.forEach(r => m[r.part] = (m[r.part] || 0) + 1);
  const tot = S.records.length || 1;
  return Object.keys(m).map(k => ({ key: k, name: D.part[k] || k, pct: Math.round(m[k] / tot * 100) }))
    .sort((a, b) => b.pct - a.pct);
}

/* ---------------- 渲染 ---------------- */
function render() {
  const v = document.getElementById('view');
  const tb = document.getElementById('tabbar');
  const map = { welcome: WELCOME, onboard: ONBOARD, today: TODAY,
                record: RECORD, report: REPORT, stats: STATS, my: MY };
  v.innerHTML = (map[S.screen] || WELCOME)();
  v.className = 'screen' + (S.enter ? ' enter' : '');
  S.enter = false;
  const isTab = ['today', 'stats', 'my'].indexOf(S.screen) >= 0;
  tb.innerHTML = isTab ? TABBAR() : '';
  tb.style.display = isTab ? 'flex' : 'none';
  const dark = S.screen === 'report';
  document.getElementById('statusbar').className = 'statusbar' + (dark ? ' dark' : '');
  document.getElementById('capsule').className = 'capsule' + (dark ? ' dark' : '');
  if (S.resting) drawRest();
}

function TABBAR() {
  const items = [['train','训练','today'], ['data','数据','stats'], ['my','我的','my']];
  return items.map(([k, label, scr]) => {
    const on = S.screen === scr;
    return '<div class="tb' + (on ? ' on' : '') + '" data-act="tab" data-v="' + scr + '">'
      + '<img src="' + IMGS[k + (on ? '_on' : '')] + '"><span>' + label + '</span></div>';
  }).join('');
}

function WELCOME() {
  return `<div class="welcome">
    <div class="mark">练界</div><div class="rule"></div>
    <div class="sl">把每一次训练</div><div class="sl">留在身体上</div>
    <div class="en">TRAIN · RECORD · SEE IT GROW</div>
    <div class="foot">
      <div class="wbtn" data-act="start"><span>开始</span><span class="arw">→</span></div>
      <div class="hint">先花 30 秒，告诉我们你的情况</div>
    </div>
  </div>`;
}

function ONBOARD() {
  if (S.step === 0) {
    const lv = [['new','刚开始','还没摸过铁，先把动作学对'],
                ['some','练过一阵','断断续续练过，想重新规律起来'],
                ['trained','一直在练','有基础，想练得更系统']];
    return `<div class="onb">
      <div class="qno">01</div><div class="qt">你练了多久？</div>
      <div class="qs">这决定你的组数和起始重量</div>
      <div class="opts">${lv.map(([v,t,d]) =>
        `<div class="opt${S.level===v?' on':''}" data-act="level" data-v="${v}">
           <div class="ot">${t}</div><div class="od">${d}</div></div>`).join('')}
      </div></div>`;
  }
  const ready = S.days && S.place;
  const names = plans().map(p => p.name).join(' / ');
  return `<div class="onb">
    <div class="qno">02</div><div class="qt">一周练几次？</div>
    <div class="chips2">${[2,3,4].map(d =>
      `<div class="chip2${S.days===d?' on':''}" data-act="days" data-v="${d}">${d} 天</div>`).join('')}</div>
    <div class="qt" style="margin-top:22px">在哪练？</div>
    <div class="chips2">${[['gym','健身房'],['home','家里']].map(([v,t]) =>
      `<div class="chip2${S.place===v?' on':''}" data-act="place" data-v="${v}">${t}</div>`).join('')}</div>
    ${ready ? `<div class="pv"><div class="l">你的计划</div>
      <div class="t">一周 ${S.days} 练 · ${S.place==='home'?'居家':'健身房'} · ${names}</div></div>` : ''}
    <div class="foot">
      <div class="wbtn${ready?'':' off'}" data-act="finish">开始训练<span class="arw">→</span></div>
    </div></div>`;
}

function TODAY() {
  const p = plan();
  const items = p.items.map((it, i) => {
    const ex = EX[it.exId] || { cn: it.exId, en: '' };
    const label = it.unit === 'sec' ? it.sets + ' × ' + it.reps + '″'
      : it.unit === 'bw' ? it.sets + ' × ' + it.reps + ' 次'
      : it.sets + ' × ' + it.reps;
    const done = setsOf(i).every(s => s.done);
    return `<div class="it" data-act="openex" data-v="${i}">
      <span class="no">${('0'+(i+1)).slice(-2)}</span>
      <div class="nm"><span class="cn">${ex.cn}</span><span class="en">${(ex.en||'').toUpperCase()}</span></div>
      <span class="ss">${label}</span>${done ? '<span class="tk">✓</span>' : ''}
    </div>`;
  }).join('');
  const setsTotal = p.items.reduce((a, it) => a + it.sets, 0);
  const minutes = Math.max(20, Math.round(setsTotal * 2.4 / 5) * 5);
  const allDone = S.records.length >= setsTotal;
  const started = S.records.length > 0;
  const h1 = allDone ? '今天的' + p.name + '练完了。' : (started ? '今天练了 ' + S.records.length + ' 组。' : '今天练' + p.name + '。');
  const tip = allDone ? '今天的动作都做完了。想再来一组也行，不想动就收工。'
    : (started ? '今天练了一半，接着练就行，已经勾掉的组都给你留着。'
    : '今天没时间也没关系，第二天打开还是这个训练日，不会跳过。');
  return `<div class="pg">
    <div class="brandrow"><span class="brand">练界</span><span class="date">周三 · 10 月 29 日</span></div>
    <div class="h1en">Today's Session</div>
    <div class="h1">${h1}</div>
    <div class="dots-week">
      ${[0,1,2].slice(0, weekTarget()).map(i =>
        `<span class="dw${i < todayDone() ? ' on' : ''}"></span>`).join('')}
      <span class="dwt">本周 ${todayDone()} / ${weekTarget()}</span>
    </div>
    <div class="card">
      <img class="art" src="${IMGS['art_' + (ART[p.type] || 'barbell')]}">
      <div class="cbody">
        <div class="cen">${p.en}</div>
        <div class="cname">${p.name}</div>
        <div class="cmeta">${p.items.length} 个动作 · 约 ${minutes} 分钟</div>
        <div class="cdim">${started ? '已练 ' + S.records.length + ' 组' : '第一次练这个训练日'}</div>
        <div class="cbtn" data-act="${allDone ? 'report' : 'starttraining'}">
          <span>${allDone ? '看今日战报' : (started ? '继续训练' : '开始训练')}</span><span class="arw">→</span>
        </div>
      </div>
    </div>
    <div class="sech">动作清单</div>
    <div class="items">${items}</div>
    <div class="tip">${tip}</div>
  </div>`;
}

function RECORD() {
  const p = plan();
  const i = S.exIdx;
  const it = p.items[i];
  const ex = EX[it.exId] || { cn: it.exId, en: '' };
  const ss = setsOf(i);
  const doneN = ss.filter(s => s.done).length;
  const un = ss.filter(s => !s.done)[0];
  const big = un ? un.weight : ss[0].weight;
  const left = ss.slice(0, Math.ceil(ss.length / 2));
  const right = ss.slice(Math.ceil(ss.length / 2));
  const plateHTML = arr => arr.map(s =>
    `<div class="plate${s.done ? ' on' : ''}${isPR(i, s.no) && s.done ? ' pr' : ''}"></div>`).join('');
  const rows = ss.map(s =>
    `<div class="srow${s.done ? ' done' : ''}" data-act="toggle" data-v="${s.no}">
      <span class="i">${s.no}</span><span class="w">${s.weight || '自重'}</span>
      ${s.unit === 'kg' ? '<span class="u">kg</span>' : ''}
      <span class="x">&nbsp;×&nbsp;</span><span class="r">${s.reps}${s.unit === 'sec' ? '″' : ''}</span>
      ${isPR(i, s.no) ? '<span class="tag">PR</span>' : ''}
      <span class="ck">✓</span></div>`).join('');
  const isLast = i >= p.items.length - 1;
  const left2 = ss.length - doneN;
  return `<div class="rnav">
      <span class="back" data-act="tab" data-v="today">‹</span>
      <div class="tt">${p.name}<span class="en">第 ${('0'+(i+1)).slice(-2)} / ${('0'+p.items.length).slice(-2)} 个动作</span></div>
      <span class="swap" data-act="swap">换一个</span>
    </div>
    <div class="rwrap">
      <div class="exh"><div class="nm">${ex.cn}</div><div class="en">${(ex.en||'').toUpperCase()}</div></div>
      <div class="barbell">
        <div class="side left">${plateHTML(left)}</div><div class="bar"></div>
        <div class="side right">${plateHTML(right)}</div>
      </div>
      <div class="bignum"><span class="n">${big}</span><span class="u">${curUnit(i)}</span></div>
      <div class="sdots">${ss.map(s =>
        `<span class="sdot${s.done ? ' on' : ''}${isPR(i, s.no) && s.done ? ' pr' : ''}"></span>`).join('')}</div>
      <div class="hint">${left2 ? '还剩 ' + left2 + ' 组' : '这个动作做完了'}</div>
      <div class="sug">上次 ${it.weight - 2.5 > 0 ? it.weight - 2.5 : it.weight} kg 全部完成，今天加 ${it.weight > 2.5 ? '2.5' : '0'} kg</div>
      <div class="facts">
        <div class="f"><span class="k">这次目标</span><span class="v">${it.sets} 组 × ${it.reps} 次</span></div>
        <div class="f"><span class="k">本次容量</span><span class="v">${(ss.filter(s=>s.done).reduce((a,s)=>a+s.weight*s.reps,0)/1000).toFixed(1)} 吨</span></div>
        <div class="f"><span class="k">上次记录</span><span class="v">${it.weight} kg × ${it.reps} × ${it.sets}</span></div>
      </div>
      <div class="sets">
        <div class="sh"><span>组记录</span><span class="n2">点一行算完成</span></div>
        ${rows}
        <div class="addset">＋ 加一组</div>
      </div>
    </div>
    <div class="footbar"><div class="fbtn" data-act="next">${isLast ? '完成训练' : '完成 · 下一个动作'}</div></div>
    ${S.resting ? restHTML() : ''}`;
}

function restHTML() {
  const tot = 90;
  const pct = Math.max(0, Math.round(S.restLeft / tot * 100));
  const el = tot - S.restLeft;
  const phase = Math.floor(el % 9 / 4.5) === 0 ? '吸气' : '呼气';
  const m = Math.floor(S.restLeft / 60), sec = S.restLeft % 60;
  return `<div class="breathwrap">
    <div class="rtitle">组间休息 · 让呼吸慢下来</div>
    <div class="breath">
      <div class="ring" style="background:conic-gradient(#3C4A32 0% ${pct}%, #DCD8C8 ${pct}% 100%)"></div>
      <div class="glow"></div>
      <div class="core"><span class="tm">${('0'+m).slice(-2)}:${('0'+sec).slice(-2)}</span>
        <span class="ph">${phase}</span></div>
    </div>
    <div class="rsub">跟着圆圈：放大吸气，缩小呼气</div>
    <div class="rsk" data-act="skip">跳过休息</div>
  </div>`;
}
function drawRest() {
  const w = document.querySelector('.breathwrap');
  if (w) w.outerHTML = restHTML();
}

function REPORT() {
  const total = S.records.length;
  const v = vol();
  const parts = partPct();
  const exN = new Set(S.records.map(r => r.exIdx)).size;
  const prs = S.records.filter(r => isPR(r.exIdx, r.no));
  const planned = plan().items.reduce((a, it) => a + it.sets, 0);
  const comment = total >= planned ? '计划全部完成。好好吃一顿，好好睡。'
    : '计划 ' + planned + ' 组，完成 ' + total + ' 组。留点力气给下次也好。';
  return `<div class="dark">
    <div class="kick">2026.10.29 · 周三</div>
    <div class="h1en">Session Report</div>
    <div class="h1">今天练完了。</div>
    <div class="plan">${plan().name}</div>
    <div class="dnums">
      <div class="st"><div class="v">${total}</div><div class="k">组</div></div>
      <div class="st"><div class="v">${(v/1000).toFixed(1)}</div><div class="k">吨</div></div>
      <div class="st"><div class="v">${exN}</div><div class="k">个动作</div></div>
    </div>
    ${prs.length ? `<div class="prbox">
      <div class="prhead"><span class="d2"></span><span class="t">今天破了 ${prs.length} 个纪录</span></div>
      ${prs.map(r => `<div class="prrow"><span class="cn">${r.cn}</span>
        <span class="w">${r.weight}kg</span><span class="dl">+2.5</span></div>`).join('')}
    </div>` : ''}
    <div class="sech">今天练了</div>
    <div style="margin-top:10px">${parts.map(p =>
      `<div class="prow"><span class="nm">${p.name}</span>
        <div class="bw"><div class="bf" style="width:${p.pct}%"></div></div>
        <span class="pc">${p.pct}%</span></div>`).join('')}</div>
    <div class="comment">${comment}</div>
    <div class="dbtn" data-act="tab" data-v="today">完成</div>
  </div>`;
}

function STATS() {
  const total = S.records.length;
  const v = vol();
  const parts = partPct();
  const trained = total > 0;
  const cells = [];
  const trainedDays = trained ? { 29: 1 } : {};
  for (let i = 0; i < 3; i++) cells.push('<div class="cell"></div>');
  for (let d = 1; d <= 31; d++) {
    let cls = 'cell';
    if (trainedDays[d]) cls += ' on';
    if (d === 29) cls += ' today';
    cells.push('<div class="' + cls + '"><div class="cd">' + d + '</div></div>');
  }
  if (!trained) {
    return `<div class="pg">
      <div class="brandrow"><span class="brand">练界</span><span class="date">10 月</span></div>
      <div class="h1en">Your Record</div><div class="h1">还没有记录。</div>
      <div class="empty2"><div class="e1">练一次，这里就有东西了。</div>
      <div class="e2">去「训练」勾掉一组，这里的数字就会动起来。</div></div>
    </div>`;
  }
  return `<div class="pg">
    <div class="brandrow"><span class="brand">练界</span><span class="date">10 月</span></div>
    <div class="h1en">Your Record</div><div class="h1">你练了 1 天。</div>
    <div class="nums">
      <div class="st"><div class="v">1</div><div class="k">本月天数</div></div>
      <div class="st"><div class="v">1/${weekTarget()}</div><div class="k">本周</div></div>
      <div class="st"><div class="v">${(v/1000).toFixed(1)}</div><div class="k">累计吨数</div></div>
    </div>
    <div class="cal"><div class="cgrid">
      <div class="wd">一</div><div class="wd">二</div><div class="wd">三</div><div class="wd">四</div>
      <div class="wd">五</div><div class="wd">六</div><div class="wd">日</div>
      ${cells.join('')}
    </div></div>
    <div class="sech">练了什么部位</div>
    <div style="margin-top:10px">${parts.map(p =>
      `<div class="prow"><span class="nm">${p.name}</span>
        <div class="bw"><div class="bf" style="width:${p.pct}%"></div></div>
        <span class="pc">${p.pct}%</span></div>`).join('')}</div>
  </div>`;
}

function MY() {
  const names = plans().map(p => `<span class="pk"><b>${p.key}</b><span class="s2">${p.name}</span></span>`).join('');
  return `<div class="pg">
    <div class="brandrow"><span class="brand">练界</span><span class="date">SETTINGS</span></div>
    <div class="h1en">Your Plan</div><div class="h1">把训练，调成你的。</div>
    <div class="pcard"><div class="cl">当前计划</div>
      <div class="cn2">一周 ${S.days} 练 · ${S.place==='home'?'居家':'健身房'}</div>
      <div class="keys">${names}</div></div>
    <div class="sech">一周练几次</div>
    <div class="chips3">${[2,3,4].map(d =>
      `<div class="chip3${S.days===d?' on':''}" data-act="days" data-v="${d}">${d} 天</div>`).join('')}</div>
    <div class="sech">在哪练</div>
    <div class="chips3">${[['gym','健身房'],['home','家里']].map(([v,t]) =>
      `<div class="chip3${S.place===v?' on':''}" data-act="place" data-v="${v}">${t}</div>`).join('')}</div>
    <div class="sech">数据</div>
    <div class="rows">
      <div class="row2" data-act="reset"><span class="rt danger">重置演示</span><span class="rn">回到欢迎页</span></div>
    </div>
    <div class="about">练界 · 可交互演示 · 数据只在本页</div>
  </div>`;
}

/* ---------------- 交互 ---------------- */
function resetRest() {
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  S.resting = false;
}
function startRest() {
  resetRest();
  S.resting = true;
  S.restLeft = 90;
  render();
  S.timer = setInterval(() => {
    S.restLeft -= 1;
    if (S.restLeft <= 0) { resetRest(); render(); return; }
    drawRest();
  }, 1000);
}

function resetOnPlanChange() {
  S.planIdx = 0; S.exIdx = 0; S.done = {}; S.records = [];
  resetRest();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const v = el.dataset.v;

  if (act === 'start') { S.screen = 'onboard'; S.step = 0; S.enter = true; return render(); }
  if (act === 'level') { S.level = v; S.step = 1; S.enter = true; return render(); }
  if (act === 'days' || act === 'place') {
    if (act === 'days') S.days = Number(v); else S.place = v;
    resetOnPlanChange();
    S.enter = true;
    return render();
  }
  if (act === 'finish') {
    if (!S.days || !S.place) return;
    S.screen = 'today'; S.enter = true; return render();
  }
  if (act === 'tab') { resetRest(); S.screen = v; S.enter = true; return render(); }
  if (act === 'starttraining') { S.exIdx = 0; resetRest(); S.screen = 'record'; S.enter = true; return render(); }
  if (act === 'openex') { S.exIdx = Number(v); resetRest(); S.screen = 'record'; S.enter = true; return render(); }
  if (act === 'toggle') {
    const i = S.exIdx, no = Number(v);
    const key = i + ':' + no;
    const it = plan().items[i];
    const ex = EX[it.exId];
    if (S.done[key]) {
      delete S.done[key];
      const k = S.records.findIndex(r => r.exIdx === i && r.no === no);
      if (k >= 0) S.records.splice(k, 1);
      return render();
    }
    S.done[key] = true;
    S.records.push({ exIdx: i, no: no, weight: it.weight, reps: it.reps,
                     unit: it.unit || 'kg', cn: ex.cn, part: ex.part });
    return startRest();
  }
  if (act === 'next') {
    resetRest();
    if (S.exIdx < plan().items.length - 1) { S.exIdx += 1; S.enter = true; return render(); }
    if (!S.records.length) { S.screen = 'today'; return render(); }
    S.screen = 'report'; S.enter = true; return render();
  }
  if (act === 'skip') { resetRest(); return render(); }
  if (act === 'report') { S.screen = 'report'; S.enter = true; return render(); }
  if (act === 'swap') { return; }
  if (act === 'reset') {
    location.reload();
  }
});

/* 支持直接打开 #today / #record / #stats / #my（方便分享和截图） */
(function () {
  const h = (location.hash || '').replace('#', '');
  const ok = ['welcome', 'onboard', 'today', 'record', 'report', 'stats', 'my'];
  if (ok.indexOf(h) >= 0) { S.screen = h; if (h === 'onboard') S.step = 1; }
})();

render();
</script>
</body>
