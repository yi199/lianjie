# 练界 · Nginx 反向代理（HTTPS 终止 + 限流 + 真实 IP）
#
# 用法见 deploy/README.md：
#   - 域名/证书补齐后把 <域名> 换成真实域名
#   - 证书放到 deploy/certs/fullchain.pem 与 privkey.pem（certbot 输出软链过来）
#   - compose 里 nginx 服务挂载本文件到 /etc/nginx/conf.d/default.conf

# 每 IP 的粗粒度限流：正常一次同步 1~2 个请求，10r/s 足够宽松，挡的是脚本刷接口
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;

# 80 只做跳转（小程序不用 http，但 ACME 验证和手动访问会走这里）
server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 请求体上限 2MB（契约 §4.2：超出返回 400 BODY_INVALID）
    client_max_body_size 2m;

    # 不要暴露服务端版本
    server_tokens off;

    # 探针不记日志、不限流
    location = /api/healthz {
        access_log off;
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    location /api/ {
        limit_req zone=api_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy_common.conf;

        # 同步可能一次传 500 行，给足时间（后端自己 10s 超时）
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
