services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lianjie
      POSTGRES_PASSWORD: lianjie_dev_pw
      POSTGRES_DB: lianjie
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lianjie -d lianjie"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://lianjie:lianjie_dev_pw@db:5432/lianjie?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      WECHAT_APPID: "${WECHAT_APPID:-}"
      WECHAT_SECRET: "${WECHAT_SECRET:-}"
      DEV_MODE: "${DEV_MODE:-true}"
      TZ_NAME: "Asia/Shanghai"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
